<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Dashboard</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- ───────────── HEADER: Greeting + Clock ───────────── -->
    <header class="header">
      <div class="greeting-block">
        <p id="greeting" class="greeting"></p>
        <h1 id="clock" class="clock"></h1>
        <p id="date-display" class="date-display"></p>
      </div>

      <!-- Settings button -->
      <button class="btn-settings" id="btn-settings" title="Settings" aria-label="Open settings">⚙️</button>
    </header>

    <main class="main-grid">
      <!-- ───────────── FOCUS TIMER ───────────── -->
      <section class="card timer-card" aria-label="Focus Timer">
        <div class="card-title-row">
          <h2 class="card-title">Focus Timer</h2>
          <button class="btn-icon timer-edit-btn" id="timer-edit-btn" title="Change duration" aria-label="Change timer duration">✏️</button>
        </div>
        <div class="timer-display" id="timer-display">25:00</div>
        <div class="timer-controls">
          <button id="timer-start" class="btn btn-primary">Start</button>
          <button id="timer-stop" class="btn btn-secondary">Stop</button>
          <button id="timer-reset" class="btn btn-ghost">Reset</button>
        </div>
        <div class="timer-status" id="timer-status">Ready</div>
      </section>

      <!-- ───────────── TO-DO LIST ───────────── -->
      <section class="card todo-card" aria-label="To-Do List">
        <h2 class="card-title">To-Do List</h2>

        <form class="todo-form" id="todo-form">
          <input
            type="text"
            id="todo-input"
            class="todo-input"
            placeholder="Add a new task…"
            autocomplete="off"
            maxlength="120"
          />
          <button type="submit" class="btn btn-primary">Add</button>
        </form>

        <ul class="todo-list" id="todo-list" aria-live="polite"></ul>

        <div class="todo-footer">
          <span id="todo-count" class="todo-count"></span>
          <button id="clear-done" class="btn btn-ghost btn-sm">Clear done</button>
        </div>
      </section>

      <!-- ───────────── QUICK LINKS ───────────── -->
      <section class="card links-card" aria-label="Quick Links">
        <h2 class="card-title">Quick Links</h2>

        <form class="link-form" id="link-form">
          <input
            type="text"
            id="link-name"
            class="link-input"
            placeholder="Name"
            maxlength="30"
            required
          />
          <input
            type="url"
            id="link-url"
            class="link-input"
            placeholder="https://…"
            required
          />
          <button type="submit" class="btn btn-primary">Add</button>
        </form>

        <div class="links-grid" id="links-grid" aria-live="polite"></div>
      </section>
    </main>

    <!-- ───────────── EDIT TASK MODAL ───────────── -->
    <div class="modal-overlay" id="modal-overlay" aria-modal="true" role="dialog" hidden>
      <div class="modal">
        <h3 class="modal-title">Edit Task</h3>
        <input
          type="text"
          id="modal-input"
          class="todo-input"
          maxlength="120"
        />
        <div class="modal-actions">
          <button id="modal-save" class="btn btn-primary">Save</button>
          <button id="modal-cancel" class="btn btn-ghost">Cancel</button>
        </div>
      </div>
    </div>

    <!-- ───────────── SETTINGS MODAL ───────────── -->
    <div class="modal-overlay" id="settings-overlay" aria-modal="true" role="dialog" hidden>
      <div class="modal settings-modal">
        <h3 class="modal-title">⚙️ Settings</h3>

        <!-- Theme toggle -->
        <div class="settings-row">
          <label class="settings-label">Theme</label>
          <div class="theme-toggle" id="theme-toggle">
            <button class="theme-btn" data-theme="dark">🌙 Dark</button>
            <button class="theme-btn" data-theme="light">☀️ Light</button>
          </div>
        </div>

        <!-- Custom name -->
        <div class="settings-row">
          <label class="settings-label" for="input-name">Your Name</label>
          <input
            type="text"
            id="input-name"
            class="todo-input"
            placeholder="e.g. Alex"
            maxlength="30"
          />
          <p class="settings-hint">Shows as "Good morning, Alex!" in the greeting</p>
        </div>

        <!-- Pomodoro duration -->
        <div class="settings-row">
          <label class="settings-label" for="input-pomodoro">Pomodoro Duration (minutes)</label>
          <input
            type="number"
            id="input-pomodoro"
            class="todo-input"
            min="1"
            max="120"
            step="1"
            placeholder="25"
          />
          <p class="settings-hint">Default is 25 minutes. Changes take effect on next Reset.</p>
        </div>

        <div class="modal-actions">
          <button id="settings-save" class="btn btn-primary">Save Settings</button>
          <button id="settings-cancel" class="btn btn-ghost">Cancel</button>
        </div>
      </div>
    </div>

    <!-- ───────────── TIMER EDIT MODAL ───────────── -->
    <div class="modal-overlay" id="timer-modal-overlay" aria-modal="true" role="dialog" hidden>
      <div class="modal">
        <h3 class="modal-title">⏱️ Change Timer Duration</h3>
        <label class="settings-label" for="timer-modal-input">Duration (minutes)</label>
        <input
          type="number"
          id="timer-modal-input"
          class="todo-input"
          min="1"
          max="120"
          step="1"
          placeholder="25"
        />
        <p class="settings-hint">Timer will reset to the new duration.</p>
        <div class="modal-actions">
          <button id="timer-modal-save" class="btn btn-primary">Apply</button>
          <button id="timer-modal-cancel" class="btn btn-ghost">Cancel</button>
        </div>
      </div>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
